name: Deploy BidPilot to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate required files
        run: |
          set -e
          for f in index.html styles.css app.js README.md docs/API_CONTRACT.md docs/DATA_MODEL.md docs/PRODUCTION_CHECKLIST.md; do
            test -f "$f"
          done
      - name: Validate JavaScript syntax
        run: node --check app.js

  browser-smoke:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local static server
        run: python3 -m http.server 4173 >/tmp/bidpilot-server.log 2>&1 &
      - name: Run browser smoke
        env:
          SMOKE_URL: http://127.0.0.1:4173/
        run: node e2e/smoke.cjs

  deploy:
    needs: [validate, browser-smoke]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
